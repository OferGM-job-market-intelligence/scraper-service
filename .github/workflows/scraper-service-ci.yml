# =============================================================================
# CI/CD Pipeline — Scraper Service (Bun.js)
# =============================================================================
# Thin caller workflow that inherits all CI/CD logic from the centralized
# templates in the .github organization repo.
#
# Template Source: OferGM-job-market-intelligence/.github
#
# Trigger Strategy (three-tier):
#   Every push (any branch) → formatAndLint + unitTests        
#   Pull request → + codeCoverage + integrationTests + scan    
#   Push to main → + build + deploy                            
# =============================================================================

name: CI/CD Pipeline

on:
  # ── Tier 1: Every push (fast feedback) ──────────────────────────────────
  push:
    branches: ["**"]  # All branches — lint & test on every push
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

  # ── Tier 2: Pull requests (quality gates) ───────────────────────────────
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Tier 1: Every Push — Fast Feedback (~2 min)
# These run on EVERY push to ANY branch so the developer knows immediately
# if their code has formatting or test issues.
# =============================================================================
jobs:
  format-and-lint:
    name: Format & Lint
    uses: OferGM-job-market-intelligence/.github/.github/workflows/template-format-and-lint.yml@main
    with:
      language: bunjs
      node_version: "1.3.9"
      fail_on_warnings: false  # TODO: Set to true once codebase stabilizes

