  scan:
    name: Security Scan
    if: github.event_name == 'pull_request'
    needs: [format-and-lint]
    uses: OferGM-job-market-intelligence/.github/.github/workflows/template-scan.yml@main
    with:
      language: bunjs
      node_version: "1.3.9"
      scan_docker_image: false  # TODO: Enable after Dockerfile is created (~Week 3)
      fail_on_high_severity: false  # TODO: Set to true by Week 12

